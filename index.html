<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اوريفيو | وكالة تسويق للبراندات</title>
  <meta name="description" content="اوريفيو وكالة تسويق: سوشيال ميديا، إعلانات ممولة، ظهور في Google، فيديو وهوية بصرية — مع تقرير بالأرقام كل شهر.">
  <meta name="theme-color" content="#2a050e">
  <meta property="og:title" content="اوريفيو | وكالة تسويق للبراندات">
  <meta property="og:description" content="نبني براندك ونحوّل متابعينك لعملاء. سوشيال ميديا، إعلانات، فيديو وهوية بصرية.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_EG">
  <link rel="icon" href="icon.png">
  <link rel="preload" href="thmanyahsans-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="thmanyahsans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">تخطّي للمحتوى</a>

  <header class="header" id="header"></header>

  <main id="main">
    <section class="hero" id="hero"></section>
    <section class="stats" id="stats" aria-label="أرقامنا"></section>
    <section class="section" id="services"></section>
    <section class="section section-dark" id="difference"></section>
    <section class="section" id="clients"></section>
    <section class="section section-tint" id="packages"></section>
    <section class="section" id="work"></section>
    <section class="section section-tint" id="faq"></section>
    <section class="section section-dark" id="contact"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="كلّمنا على واتساب"></a>

  <noscript><p style="padding:2rem;text-align:center">الموقع محتاج JavaScript علشان يتعرض صح.</p></noscript>

  <script>
    /* لو في ملف ماتحمّلش أو في خطأ، بيظهر السبب بدل صفحة بيضا */
    window.addEventListener("error", function (e) {
      var m = document.getElementById("main"); if (!m || m.querySelector("h1")) return;
      var what = e.target && (e.target.src || e.target.href) ? "الملف ده ماتحمّلش: " + (e.target.src || e.target.href) : "خطأ: " + e.message;
      m.innerHTML = '<div style="padding:48px 20px;max-width:640px;margin:auto;font:17px/1.9 Tahoma,Arial,sans-serif;color:#6b0f26"><b>الموقع مش قادر يتحمّل.</b><br>' + what.replace(/</g, "&lt;") + "<br><small>اتأكد إن كل الملفات (style.css و main.js و content.js والخطوط والصور) مرفوعة جنب index.html في نفس المستوى.</small></div>";
    }, true);
  </script>
  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
