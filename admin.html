<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة تعديل موقع اوريفيو</title>
  <link rel="icon" href="images/icon.png">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="bar">
    <div class="bar-title">
      <img src="images/icon.png" alt="">
      <b>لوحة التعديل</b>
    </div>
    <div class="bar-actions">
      <button class="b b-ghost" id="btnPreview" type="button">تحديث المعاينة</button>
      <button class="b b-light" id="btnExport" type="button">تحميل الملفات (ZIP)</button>
    </div>
  </header>

  <nav class="mtabs" id="mtabs">
    <button type="button" class="on" data-p="edit">تعديل</button>
    <button type="button" data-p="view">معاينة</button>
  </nav>

  <div class="layout" id="layout" data-pane="edit">
    <section class="editor" id="editor" aria-label="المحتوى"></section>
    <section class="preview" aria-label="معاينة الموقع">
      <iframe id="frame" src="index.html" title="معاينة الموقع"></iframe>
    </section>
  </div>

  <dialog id="doneDialog">
    <h2>الملفات اتحمّلت ✅</h2>
    <ol>
      <li>فكّ ضغط <b>aurevo-update.zip</b>.</li>
      <li>هتلاقي فولدر <b>data</b> (فيه <b>content.js</b> الجديد) وفولدر <b>images/uploads</b> (الصور اللي رفعتها).</li>
      <li>على GitHub: افتح الـ Repository واضغط <b>Add file ← Upload files</b>.</li>
      <li>اسحب الفولدرين، واضغط <b>Commit changes</b>.</li>
      <li>بعد دقيقة الموقع يتحدّث.</li>
    </ol>
    <button class="b b-wine" id="closeDone" type="button">تمام</button>
  </dialog>

  <script src="data/content.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
